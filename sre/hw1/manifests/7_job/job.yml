---
apiVersion: batch/v1
kind: Job
metadata:
  name: hello
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 15
  template:
    spec:
      containers:
      - name: hello
        image: busybox
        args:
          - /bin/sh
          - -c
          - while true; do date; echo Hello from the Kubernetes cluster; sleep 1; done
      restartPolicy: Never

